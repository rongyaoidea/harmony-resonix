<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>resonix · HarmonyOS</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --line:#262b36; --fg:#e6e9ef;
    --muted:#8b93a3; --accent:#4f8cff; --user:#2b3a55; --tool:#20242e;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--fg);font:14px/1.55 -apple-system,"HarmonyOS Sans SC","PingFang SC",sans-serif;
       height:100vh;display:flex;flex-direction:column}
  header{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
  header .dot{width:8px;height:8px;border-radius:50%;background:#e5484d}
  header .dot.on{background:#46d68c}
  header b{font-size:15px} header span{color:var(--muted);font-size:12px}
  main{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
  .msg{max-width:92%;padding:9px 12px;border-radius:12px;white-space:pre-wrap;word-break:break-word}
  .msg.user{align-self:flex-end;background:var(--user)}
  .msg.agent{align-self:flex-start;background:var(--panel);border:1px solid var(--line)}
  .msg.tool{align-self:flex-start;background:var(--tool);color:var(--muted);font-family:ui-monospace,Menlo,monospace;font-size:12px;border:1px dashed var(--line)}
  .msg.sys{align-self:center;color:var(--muted);font-size:12px}
  footer{border-top:1px solid var(--line);padding:10px;display:flex;gap:8px;background:var(--panel)}
  textarea{flex:1;background:#0d1016;border:1px solid var(--line);border-radius:10px;color:var(--fg);
           padding:10px;resize:none;height:52px;font:inherit}
  textarea:focus{outline:none;border-color:var(--accent)}
  button{background:var(--accent);border:0;border-radius:10px;color:#fff;padding:0 18px;font-size:14px}
  button:disabled{opacity:.45}
</style>
</head>
<body>
<header>
  <div class="dot" id="dot"></div>
  <b>resonix</b><span id="status">connecting…</span>
  <span style="margin-left:auto" id="model"></span>
</header>
<main id="log"></main>
<footer>
  <textarea id="input" placeholder="描述任务，Enter 发送 / Shift+Enter 换行"></textarea>
  <button id="send" disabled>发送</button>
</footer>
<script>
// ACP（Agent Client Protocol）over WebSocket 桥接。
// 方法名遵循 ACP JSON-RPC 规范；与 resonix 引擎的对接参数
//（protocolVersion 等）按其源码 docs 校准：docs/DEPLOY.md。
const logEl = document.getElementById('log');
const dot = document.getElementById('dot');
const statusEl = document.getElementById('status');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
let ws = null, nextId = 1, sessionId = null;
const pending = new Map();

function add(cls, text) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.textContent = text;
  logEl.appendChild(d);
  logEl.scrollTop = logEl.scrollHeight;
  return d;
}

function rpc(method, params) {
  return new Promise((resolve, reject) => {
    const id = nextId++;
    pending.set(id, { resolve, reject });
    ws.send(JSON.stringify({ jsonrpc: '2.0', id, method, params }));
  });
}

function connect() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws`);
  ws.binaryType = 'arraybuffer';
  ws.onopen = async () => {
    dot.classList.add('on'); statusEl.textContent = 'initializing';
    try {
      const init = await rpc('initialize', {
        protocolVersion: 1,
        clientCapabilities: {}
      });
      const name = (init && (init.agentInfo?.name || init.serverInfo?.name)) || 'agent';
      document.getElementById('model').textContent = name;
      const sn = await rpc('session/new', { cwd: '/storage/Users/currentUser', mcpServers: [] });
      sessionId = sn.sessionId || sn.session_id;
      statusEl.textContent = 'ready';
      sendBtn.disabled = false;
      add('sys', `会话就绪：${name}${sessionId ? ' · ' + sessionId : ''}`);
    } catch (e) {
      statusEl.textContent = 'ACP 握手失败：' + e.message;
      add('sys', 'initialize/session 失败（检查 bridge 的 --acp-cmd 是否与 resonix 实际 ACP 入口一致）');
    }
  };
  ws.onmessage = (ev) => {
    let text = typeof ev.data === 'string' ? ev.data : new TextDecoder().decode(ev.data);
    for (const line of text.split('\n')) {
      const t = line.trim();
      if (!t) continue;
      let m;
      try { m = JSON.parse(t); } catch { continue; }
      if (m.id !== undefined && (m.result !== undefined || m.error !== undefined)) {
        const p = pending.get(m.id);
        if (p) {
          pending.delete(m.id);
          m.error ? p.reject(new Error(m.error.message || 'rpc error')) : p.resolve(m.result);
        }
        continue;
      }
      // —— 通知（session/update 等）——
      if (m.method === 'session/update') {
        const u = m.params || {};
        const up = u.update || u;
        switch (up.sessionUpdate || up.type) {
          case 'agent_message_chunk':
            appendAgent(up.content?.text ?? ''); break;
          case 'tool_call':
            add('tool', `⚙ ${up.title || up.toolCallId || 'tool'} ${up.status || ''}`); break;
          case 'tool_call_update':
            add('tool', `⚙ ${up.toolCallId} → ${up.status || ''} ${up.rawInput ? JSON.stringify(up.rawInput).slice(0, 300) : ''}`); break;
          case 'plan':
            add('tool', (up.entries || []).map(e => `${e.status === 'completed' ? '✓' : e.status === 'in_progress' ? '▸' : '·'} ${e.title}`).join('\n')); break;
          default:
            if (up.content?.text) appendAgent(up.content.text);
        }
      } else if (m.method) {
        add('sys', JSON.stringify(m).slice(0, 200));
      }
    }
  };
  ws.onclose = () => {
    dot.classList.remove('on'); statusEl.textContent = 'disconnected';
    sendBtn.disabled = true;
    add('sys', '连接断开，3s 后重连…');
    setTimeout(connect, 3000);
  };
  ws.onerror = () => { statusEl.textContent = 'ws error'; };
}

let agentBuf = null;
function appendAgent(text) {
  if (!agentBuf) agentBuf = add('agent', '');
  agentBuf.textContent += text;
  logEl.scrollTop = logEl.scrollHeight;
}

async function send() {
  const text = input.value.trim();
  if (!text || !sessionId) return;
  input.value = '';
  add('user', text);
  agentBuf = null;
  try {
    await rpc('session/prompt', {
      sessionId,
      prompt: [{ type: 'text', text }]
    });
    agentBuf = null;
  } catch (e) {
    add('sys', 'turn 异常：' + e.message);
  }
}

sendBtn.onclick = send;
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
connect();
</script>
</body>
</html>
