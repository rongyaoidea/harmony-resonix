<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext x='16' y='24' font-size='24' text-anchor='middle' fill='%23C96442'%3E%E2%9C%B3%3C/text%3E%3C/svg%3E">
<title>resonix · HarmonyOS</title>
<style>
/* ============================================================================
   resonix 聊天 UI — finesse-ui product register × Claude 主题
   原则：tinted neutrals（禁纯白/纯黑大面积）、hairline 边框、暖色阴影、
        衬线标题 + Sans 正文、单一 terracotta 品牌色、反 AI-slop（无渐变横幅、
        无霓虹、无默认蓝紫）。深浅双主题随系统切换。
   Token 来源：Anthropic 公开设计体系（parchment #F5F4ED / ivory #FAF9F5 /
        carbon ink #141413 / terracotta #C96442 / clay #D97757 / chalk #E7E6E1）
   ============================================================================ */
:root{
  color-scheme: light;
  --canvas:#F5F4ED;         /* parchment 画布 */
  --surface:#FAF9F5;        /* ivory 卡片/输入框 */
  --raised:#FFFFFF;         /* 消息气泡 elevated */
  --sand:#E8E6DC;           /* warm sand 用户气泡 */
  --ink:#141413;            /* carbon ink 主文本 */
  --ink-2:#373734;          /* graphite 次要 */
  --ink-3:#7B7974;          /* ashen 弱化 */
  --ink-4:#9C9A92;          /* pebble 极弱 */
  --line:#E7E6E1;           /* chalk hairline */
  --line-2:#B7B7B5;         /* mist 强边框 */
  --brand:#C96442;          /* terracotta */
  --brand-2:#D97757;        /* clay */
  --brand-soft:#F3E7DF;     /* terracotta tint 背景 */
  --error:#B53333;          /* crimson */
  --ok:#629987;             /* mineral */
  --code-bg:#F0EEE6;        /* 代码块底 */
  --shadow:0 1px 2px rgba(20,20,19,.05),0 4px 16px rgba(20,20,19,.07);
  --serif:Georgia,"Source Serif 4",Charter,"Times New Roman","Noto Serif SC",serif;
  --sans:system-ui,-apple-system,"HarmonyOS Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,"JetBrains Mono","SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme: dark;
    --canvas:#141413;       /* 暖近黑（带橄榄底），非纯黑 */
    --surface:#1F1E1D;
    --raised:#262524;
    --sand:#30302E;
    --ink:#FAF9F5;
    --ink-2:rgba(248,248,247,.78);
    --ink-3:#9C9A92;
    --ink-4:#7B7974;
    --line:#30302E;
    --line-2:#4A4A47;
    --brand:#D97757;        /* 深色下用更亮的 clay */
    --brand-2:#E08B6D;
    --brand-soft:#38291F;
    --error:#E06A5A;
    --ok:#7FB5A4;
    --code-bg:#1B1A19;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--canvas);color:var(--ink);font:15px/1.6 var(--sans);
     display:flex;flex-direction:column;overflow:hidden;
     -webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:2px}

/* ── header ─────────────────────────────────────────────── */
header{display:flex;align-items:center;gap:9px;padding:11px 16px;
       border-bottom:1px solid var(--line);background:var(--canvas);
       padding-top:calc(11px + env(safe-area-inset-top))}
.mark{font-size:17px;color:var(--brand);line-height:1;
      display:inline-block;transition:opacity .3s ease}
.mark.thinking{opacity:.35}
.brand{font-family:var(--serif);font-size:16px;font-weight:500;letter-spacing:.01em}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--ink-3);
      border:1px solid var(--line);border-radius:999px;padding:2px 9px;background:var(--surface)}
.pill .pt{width:6px;height:6px;border-radius:50%;background:var(--ink-4)}
.pill.on .pt{background:var(--ok)}
.pill.err{color:var(--error);border-color:var(--error)}
.pill.err .pt{background:var(--error)}
header .spacer{flex:1}
header .agent-name{font-family:var(--mono);font-size:11.5px;color:var(--ink-4);max-width:36vw;
                   overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ── 会话区 ─────────────────────────────────────────────── */
main{flex:1;overflow-y:auto;overscroll-behavior:contain}
.stream{max-width:720px;margin:0 auto;padding:20px 16px 12px;
        display:flex;flex-direction:column;gap:14px}
.msg{max-width:88%;white-space:pre-wrap;word-break:break-word}
.msg.user{align-self:flex-end;background:var(--sand);color:var(--ink);
          padding:9px 14px;border-radius:16px 16px 4px 16px}
.msg.agent{align-self:stretch;max-width:100%;color:var(--ink);font-size:15px}
.msg.agent .prose{display:block}
.msg.agent code{font-family:var(--mono);font-size:.86em;background:var(--code-bg);
                border:1px solid var(--line);border-radius:5px;padding:1px 5px}
.msg.agent pre{font-family:var(--mono);font-size:12.5px;line-height:1.55;
               background:var(--code-bg);border:1px solid var(--line);border-radius:12px;
               padding:12px 14px;margin:8px 0;overflow-x:auto;white-space:pre}
.cursor{display:inline-block;width:7px;height:15px;background:var(--brand-2);
        vertical-align:-2px;margin-left:2px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.thinking{align-self:flex-start;display:flex;gap:4px;padding:6px 2px}
.thinking i{width:5px;height:5px;border-radius:50%;background:var(--brand-2);
            animation:bounce 1.2s ease-in-out infinite}
.thinking i:nth-child(2){animation-delay:.15s}
.thinking i:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-4px);opacity:1}}

/* 工具调用：mono + 左侧 hairline 竖线（引用块式，无虚线框） */
.msg.tool{align-self:stretch;max-width:100%;font-family:var(--mono);font-size:12px;
          color:var(--ink-3);padding:2px 0 2px 12px;border-left:2px solid var(--line);
          display:flex;align-items:baseline;gap:8px}
.msg.tool .t-name{color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msg.tool .t-status{flex:none;font-size:10.5px;border:1px solid var(--line-2);
                    border-radius:999px;padding:0 7px;color:var(--ink-3)}
.msg.tool .t-status.running{color:var(--brand);border-color:var(--brand)}
.msg.tool .t-status.completed{color:var(--ok);border-color:var(--ok)}
.msg.tool .t-status.failed,.msg.tool .t-status.error{color:var(--error);border-color:var(--error)}
.msg.sys{align-self:center;max-width:92%;text-align:center;font-size:12px;color:var(--ink-4)}
.msg.sys-ok{color:var(--ok)}
.msg.sys-rej{color:var(--error)}

/* plan 清单 */
.msg.plan{align-self:stretch;max-width:100%;font-size:13.5px;color:var(--ink-2);
          padding:10px 14px;background:var(--surface);border:1px solid var(--line);
          border-radius:12px;white-space:pre-wrap}

/* ── 工具审批卡片 ──────────────────────────────────────── */
.perm{align-self:stretch;background:var(--surface);border:1px solid var(--line);
      border-left:3px solid var(--brand);border-radius:14px;padding:14px 16px;
      box-shadow:var(--shadow);animation:rise .22s ease}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.perm-head{font-family:var(--serif);font-size:14.5px;font-weight:500;color:var(--ink);
           display:flex;align-items:center;gap:7px;margin-bottom:6px}
.perm-head .mark{font-size:13px}
.perm-title{font-family:var(--mono);font-size:12.5px;color:var(--ink-2);
            background:var(--code-bg);border:1px solid var(--line);border-radius:8px;
            padding:8px 10px;margin-bottom:12px;word-break:break-all}
.perm-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{font:500 13.5px var(--sans);border-radius:999px;padding:7px 18px;cursor:pointer;
     border:1px solid transparent;transition:opacity .15s}
.btn:active{opacity:.8}
.btn.primary{background:var(--ink);color:var(--surface)}
.btn.ghost{background:transparent;color:var(--ink-2);border-color:var(--line-2)}
.btn.link{background:transparent;color:var(--brand);padding:7px 6px;text-decoration:underline;
          text-underline-offset:3px}
.perm-hint{font-size:11.5px;color:var(--ink-4);margin-top:8px}

/* ── 空状态 ─────────────────────────────────────────────── */
.hero{max-width:720px;margin:0 auto;padding:9vh 24px 0;text-align:left}
.hero h1{font-family:var(--serif);font-weight:500;font-size:27px;line-height:1.3;
         color:var(--ink);margin-bottom:6px}
.hero h1 .mark{font-size:24px;vertical-align:1px}
.hero p{font-size:13.5px;color:var(--ink-3);margin-bottom:22px}
.chips{display:flex;flex-direction:column;gap:9px;max-width:420px}
.chip{text-align:left;font:13.5px var(--sans);color:var(--ink-2);cursor:pointer;
      background:var(--surface);border:1px solid var(--line);border-radius:12px;
      padding:11px 15px;box-shadow:var(--shadow)}
.chip:active{background:var(--brand-soft)}

/* ── 输入区 ─────────────────────────────────────────────── */
footer{padding:8px 14px calc(10px + env(safe-area-inset-bottom));background:var(--canvas)}
.composer{max-width:720px;margin:0 auto;display:flex;align-items:flex-end;gap:10px;
          background:var(--surface);border:1px solid var(--line);border-radius:20px;
          padding:9px 10px 9px 16px;box-shadow:var(--shadow);
          transition:box-shadow .15s,border-color .15s}
.composer:focus-within{border-color:var(--brand-2);
          box-shadow:0 0 0 1px var(--brand-2),var(--shadow)}
.composer textarea{flex:1;background:transparent;border:0;outline:none;resize:none;
                   color:var(--ink);font:15px/1.55 var(--sans);min-height:24px;
                   max-height:132px;padding:4px 0}
.composer textarea::placeholder{color:var(--ink-4)}
.send{flex:none;width:34px;height:34px;border-radius:50%;border:0;cursor:pointer;
      background:var(--ink);color:var(--surface);display:flex;align-items:center;
      justify-content:center;transition:opacity .15s}
.send:disabled{background:var(--line);color:var(--ink-4);cursor:default}
.send svg{width:16px;height:16px;display:block}
</style>
</head>
<body>
<header>
  <span class="mark" id="mark">✳</span>
  <span class="brand">resonix</span>
  <span class="pill" id="pill"><span class="pt"></span><span id="status">连接中</span></span>
  <span class="spacer"></span>
  <span class="agent-name" id="agent"></span>
</header>

<main id="main">
  <div class="stream" id="log"></div>
</main>

<footer>
  <div class="composer">
    <textarea id="input" rows="1" placeholder="描述任务，Enter 发送 / Shift+Enter 换行"></textarea>
    <button class="send" id="send" disabled aria-label="发送">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 13V3M3.5 7.5 8 3l4.5 4.5"/>
      </svg>
    </button>
  </div>
</footer>

<script>
// ============================================================================
// ACP（Agent Client Protocol）over WebSocket 桥接 —— 与 bridge/main.go 对接。
// 协议逻辑与线格式保持稳定：initialize → session/new → session/prompt，
// 推送经 session/update 分发；工具审批 session/request_permission 由
// 自定义审批卡片应答（不再依赖 JS confirm()，鸿蒙 ArkWeb 不自动弹 confirm）。
// ============================================================================
const logEl  = document.getElementById('log');
const mainEl = document.getElementById('main');
const mark   = document.getElementById('mark');
const pill   = document.getElementById('pill');
const statusEl = document.getElementById('status');
const input  = document.getElementById('input');
const sendBtn = document.getElementById('send');
let ws = null, nextId = 1, sessionId = null, turnActive = false;
const pending = new Map();     // rpc id → {resolve,reject}
const toolCards = new Map();   // toolCallId → DOM（tool_call_update 原地更新）

/* ── 基础渲染 ───────────────────────────────────────────── */
function el(cls, text) {
  const d = document.createElement('div');
  d.className = cls;
  if (text !== undefined) d.textContent = text;
  logEl.appendChild(d);
  return d;
}
function nearBottom() {
  return mainEl.scrollHeight - mainEl.scrollTop - mainEl.clientHeight < 80;
}
function follow(force) {
  if (force || nearBottom()) mainEl.scrollTop = mainEl.scrollHeight;
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

/* agent 消息：轻量富文本（围栏代码块 + 行内 code），全部经 textContent 注入 */
function renderRich(container, text) {
  container.innerHTML = '';
  const parts = text.split('```');
  const unclosed = parts.length % 2 === 0;   // 流式中间态：围栏未闭合
  parts.forEach((part, i) => {
    const isCode = i % 2 === 1 || (unclosed && i === parts.length - 1);
    if (isCode && part !== '') {
      const pre = document.createElement('pre');
      pre.textContent = part.replace(/^[A-Za-z0-9_+#.-]*\n/, '');
      container.appendChild(pre);
    } else if (part !== '') {
      const span = document.createElement('span');
      span.className = 'prose';
      const segs = part.split(/`([^`\n]+)`/);   // 行内 code
      segs.forEach((s, j) => {
        if (j % 2 === 1) {
          const c = document.createElement('code');
          c.textContent = s;
          span.appendChild(c);
        } else if (s !== '') {
          span.appendChild(document.createTextNode(s));
        }
      });
      container.appendChild(span);
    }
  });
}

let agentMsg = null, agentText = '', cursorEl = null;
function appendAgent(text) {
  if (!agentMsg) {
    agentMsg = el('msg agent');
    renderRich(agentMsg, '');
    cursorEl = document.createElement('span');
    cursorEl.className = 'cursor';
    agentMsg.appendChild(cursorEl);
  }
  agentText += text;
  renderRich(agentMsg, agentText);
  agentMsg.appendChild(cursorEl);
  follow();
}
function endAgent() {
  if (cursorEl) { cursorEl.remove(); cursorEl = null; }
  agentMsg = null; agentText = '';
}
function setThinking(on) {
  mark.classList.toggle('thinking', on);
  statusEl.textContent = on ? '思考中' : (sessionId ? '就绪' : statusEl.textContent);
  document.querySelectorAll('.thinking').forEach(n => n.remove());
  if (on) { const t = el('thinking'); t.innerHTML = '<i></i><i></i><i></i>'; follow(); }
}

/* ── 工具调用 / plan ────────────────────────────────────── */
function statusText(s) {
  return ({ pending:'待执行', in_progress:'运行中', running:'运行中',
            completed:'完成', failed:'失败', error:'出错' })[s] || s || '';
}
function addTool(id, title, status) {
  const d = el('msg tool');
  const name = document.createElement('span');
  name.className = 't-name';
  name.textContent = title || id || 'tool';
  const st = document.createElement('span');
  st.className = 't-status' + (status ? ' ' + status : '');
  st.textContent = statusText(status);
  d.append('⚙ ', name, st);
  if (id) toolCards.set(id, st);
  follow();
}
function updateTool(id, status, note) {
  const st = toolCards.get(id);
  if (!st) { addTool(id, note, status); return; }
  st.textContent = statusText(status) + (note ? ' · ' + note.slice(0, 40) : '');
  st.className = 't-status' + (status ? ' ' + status : '');
}
function addPlan(entries) {
  el('msg plan', (entries || [])
    .map(e => (e.status === 'completed' ? '✓ ' : e.status === 'in_progress' ? '▸ ' : '· ') + e.title)
    .join('\n'));
  follow();
}
function addSys(text, cls) { el('msg sys' + (cls ? ' ' + cls : ''), text); follow(); }

/* ── 工具审批卡片（session/request_permission）────────────
   替代 confirm()：应用内卡片，忠实呈现 ACP options，
   主操作 = 第一个 allow 项， ghost = 第一个 reject 项，
   其余选项以链接按钮补列；无可用选项时仅提供「取消」。 */
function askPermission(req) {
  return new Promise(resolve => {
    const opts = Array.isArray(req.options) ? req.options : [];
    const allow  = opts.find(o => String(o.kind || '').startsWith('allow'))  || opts[0];
    const reject = opts.find(o => String(o.kind || '').startsWith('reject')) || opts[1];
    const extra  = opts.filter(o => o !== allow && o !== reject);
    const title = (req.toolCall && (req.toolCall.title || req.toolCall.toolCallId)) || '工具调用';

    const card = document.createElement('div');
    card.className = 'perm';
    card.innerHTML = `
      <div class="perm-head"><span class="mark">✳</span>工具审批</div>
      <div class="perm-title">${esc(title)}</div>
      <div class="perm-actions"></div>
      <div class="perm-hint">resonix 请求在会话中执行此工具</div>`;
    const act = card.querySelector('.perm-actions');

    const done = (pick) => {
      card.remove();
      resolve(pick);
    };
    const mkBtn = (label, cls, pick) => {
      const b = document.createElement('button');
      b.className = 'btn ' + cls;
      b.textContent = label;
      b.onclick = () => done(pick);
      act.appendChild(b);
    };
    if (allow)  mkBtn(allow.name || '允许执行', 'primary', allow);
    if (reject) mkBtn(reject.name || '拒绝', 'ghost', reject);
    extra.forEach(o => mkBtn(o.name || o.optionId, 'link', o));
    if (!allow && !reject) mkBtn('取消', 'ghost', null);

    logEl.appendChild(card);
    follow(true);
  });
}
async function handlePermission(m) {
  const pick = await askPermission(m.params || {});
  if (pick) {
    ws.send(JSON.stringify({ jsonrpc: '2.0', id: m.id, result: {
      outcome: { outcome: 'selected', optionId: pick.optionId }
    }}));
    addSys(`${String(pick.kind || '').startsWith('reject') ? '已拒绝' : '已允许'} · ` +
           ((m.params && m.params.toolCall && m.params.toolCall.title) || '工具调用'),
           String(pick.kind || '').startsWith('reject') ? 'sys-rej' : 'sys-ok');
  } else {
    ws.send(JSON.stringify({ jsonrpc: '2.0', id: m.id, result: {
      outcome: { outcome: 'cancelled' }
    }}));
    addSys('已取消 · 工具审批', 'sys-rej');
  }
}

/* ── RPC 与连接 ─────────────────────────────────────────── */
function rpc(method, params) {
  return new Promise((resolve, reject) => {
    const id = nextId++;
    pending.set(id, { resolve, reject });
    ws.send(JSON.stringify({ jsonrpc: '2.0', id, method, params }));
  });
}
function setState(mode, text) {
  pill.className = 'pill' + (mode === 'on' ? ' on' : mode === 'err' ? ' err' : '');
  statusEl.textContent = text;
}
function connect() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws`);
  ws.binaryType = 'arraybuffer';
  ws.onopen = async () => {
    setState('on', '初始化');
    try {
      const init = await rpc('initialize', { protocolVersion: 1, clientCapabilities: {} });
      const name = (init && (init.agentInfo?.name || init.serverInfo?.name)) || 'agent';
      document.getElementById('agent').textContent = name;
      const sn = await rpc('session/new', { cwd: '/storage/Users/currentUser', mcpServers: [] });
      sessionId = sn.sessionId || sn.session_id;
      setState('on', '就绪');
      sendBtn.disabled = false;
      addSys(`会话就绪 · ${name}`);
      maybeHero(true);
    } catch (e) {
      setState('err', '握手失败');
      addSys('initialize/session 失败（检查 bridge 的 --acp-cmd 是否与 resonix 实际 ACP 入口一致）');
    }
  };
  ws.onmessage = (ev) => {
    let text = typeof ev.data === 'string' ? ev.data : new TextDecoder().decode(ev.data);
    for (const line of text.split('\n')) {
      const t = line.trim();
      if (!t) continue;
      let m;
      try { m = JSON.parse(t); } catch { continue; }
      if (m.id !== undefined && (m.result !== undefined || m.error !== undefined)) {
        const p = pending.get(m.id);
        if (p) {
          pending.delete(m.id);
          m.error ? p.reject(new Error(m.error.message || 'rpc error')) : p.resolve(m.result);
        }
        continue;
      }
      if (m.method === 'session/update') {
        const u = m.params || {};
        const up = u.update || u;
        switch (up.sessionUpdate || up.type) {
          case 'agent_message_chunk':
            setThinking(false);
            appendAgent(up.content?.text ?? '');
            break;
          case 'tool_call':
            addTool(up.toolCallId, up.title || up.toolCallId, up.status);
            break;
          case 'tool_call_update':
            updateTool(up.toolCallId, up.status, up.rawInput ? JSON.stringify(up.rawInput) : '');
            break;
          case 'plan':
            addPlan(up.entries);
            break;
          default:
            if (up.content?.text) appendAgent(up.content.text);
        }
      } else if (m.method === 'session/request_permission') {
        handlePermission(m).catch(() => {});
      } else if (m.method) {
        addSys(JSON.stringify(m).slice(0, 200));
      }
    }
  };
  ws.onclose = () => {
    setState('err', '已断开');
    sendBtn.disabled = true;
    endAgent(); setThinking(false);
    addSys('连接断开，3s 后重连…');
    setTimeout(connect, 3000);
  };
  ws.onerror = () => { if (!sessionId) setState('err', '连接异常'); };
}

/* ── 空状态 hero ────────────────────────────────────────── */
const SUGGESTIONS = [
  '解释当前目录里这个工程的结构',
  '审查最近修改的代码并指出风险',
  '写一个 shell 脚本统计日志中的错误'
];
function maybeHero(show) {
  let h = logEl.querySelector('.hero');
  if (show && !h) {
    h = document.createElement('div');
    h.className = 'hero';
    h.innerHTML = `
      <h1><span class="mark">✳</span> 今天想做点什么？</h1>
      <p>resonix 已就绪 —— 描述你的任务，引擎会在沙箱里完成它。</p>
      <div class="chips"></div>`;
    const box = h.querySelector('.chips');
    SUGGESTIONS.forEach(s => {
      const c = document.createElement('button');
      c.className = 'chip';
      c.textContent = s;
      c.onclick = () => { input.value = s; input.focus(); autoGrow(); maybeHero(false); };
      box.appendChild(c);
    });
    logEl.insertBefore(h, logEl.firstChild);
  } else if (!show && h) {
    h.remove();
  }
}

/* ── 发送 ───────────────────────────────────────────────── */
function autoGrow() {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 132) + 'px';
}
async function send() {
  const text = input.value.trim();
  if (!text || !sessionId || turnActive) return;
  input.value = ''; autoGrow();
  maybeHero(false);
  el('msg user', text);
  agentMsg = null; agentText = '';
  turnActive = true;
  sendBtn.disabled = true;
  setThinking(true);
  try {
    await rpc('session/prompt', { sessionId, prompt: [{ type: 'text', text }] });
  } catch (e) {
    addSys('turn 异常：' + e.message);
  } finally {
    endAgent(); setThinking(false);
    turnActive = false;
    sendBtn.disabled = false;
  }
}

sendBtn.onclick = send;
input.addEventListener('input', autoGrow);
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
connect();
</script>
